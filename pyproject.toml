[project]
name = "hierag"
version = "0.1.10"
description = "Core + interfaces monorepo for Hierag"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "hierag" }]
dependencies = [
    "fastapi>=0.116.0,<0.117.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
    "httpx>=0.28.1,<0.29.0",
    "fastlite",
    "openpyxl>=3.1.5,<4.0.0",
    "pandas>=2.3.0,<3.0.0",
    "beautifulsoup4>=4.13.4,<5.0.0",
    "html2text>=2025.4.15,<2026.0.0",
    "lxml>=6.0.1,<7.0.0",
    "openai>=2.6.1,<3.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "python-multipart>=0.0.20,<0.1.0",
    "numpy>=2.3.3,<3.0.0",
    "sentence-transformers>=5.1.1,<6.0.0",
    "torch>=2.8.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.10,<0.13.0",
]

[tool.uv]
package = false
